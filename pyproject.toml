[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hht_tools"
version = "0.3.0"
description = "Hilbert-Huang transform utilities: seeded EMD/CEEMDAN wrappers, instantaneous frequency at peaks, HHT spectrograms"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Diego Melgar"}]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "EMD-signal>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]
demo = ["matplotlib", "notebook"]

[project.urls]
Repository = "https://github.com/dmelgarm/hht_tools"
Issues = "https://github.com/dmelgarm/hht_tools/issues"

[tool.setuptools.packages.find]
include = ["hht_tools*"]
