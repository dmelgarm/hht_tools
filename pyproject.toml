[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hht_tools"
version = "0.2.0"
description = "Hilbert-Huang transform utilities: seeded EMD/CEEMDAN wrappers, instantaneous frequency at peaks, HHT spectrograms"
license = {file = "LICENSE"}
authors = [{name = "Diego Melgar"}]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "EMD-signal>=1.5",
]

[tool.setuptools.packages.find]
include = ["hht_tools*"]
