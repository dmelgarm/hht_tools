name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.11", "3.14"]
        include:
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]" build
      - name: Test the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -m pytest --import-mode=importlib "${GITHUB_WORKSPACE}/tests" -q
      - run: python -m build
